[package]
name = "lemmaloop-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "=0.7.5", features = ["macros"] }
hyper = "=1.3.1"
hyper-util = "=0.1.3"
http = "=1.1.0"
http-body = "=1.0.0"
http-body-util = "=0.1.1"
tokio = { version = "=1.37.0", features = ["full"] }
tokio-util = "=0.7.10"
tokio-stream = { version = "=0.1.15", features = ["sync"] }
futures = "0.3.30"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "native-tls"] }
native-tls = "=0.2.11"
security-framework = "=2.11.0"
security-framework-sys = "=2.11.0"
url = "=2.5.0"
idna = "=0.5.0"
dashmap = "=5.5.3"
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.116"
syn = "=2.0.60"
quote = "=1.0.36"
proc-macro2 = "=1.0.81"
bytes = "=1.6.1"
mio = "=0.8.11"
socket2 = "=0.5.7"
libc = "=0.2.155"
regex = "=1.10.4"
regex-automata = "=0.4.6"
regex-syntax = "=0.8.3"
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
getrandom = "=0.2.15"
tempfile = "=3.10.1"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
urlencoding = "=2.1.3"
encoding_rs = "=0.8.34"
base64 = "=0.21.7"
tower = "=0.4.13"
